<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login - Lopes Veículos Admin">
    <title>Login Admin - Lopes Veículos</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2d5a8c 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            background: white;
            padding: 3rem;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-header img {
            width: 80px;
            height: 80px;
            margin-bottom: 1rem;
        }

        .login-header h1 {
            color: #1e3c72;
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .login-header p {
            color: #666;
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #333;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #ff6b6b;
            box-shadow: 0 0 5px rgba(255, 107, 107, 0.2);
        }

        .form-group input::placeholder {
            color: #999;
        }

        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
        }

        .remember-forgot label {
            display: flex;
            align-items: center;
            margin: 0;
            color: #666;
        }

        .remember-forgot input[type="checkbox"] {
            margin-right: 0.5rem;
            cursor: pointer;
        }

        .remember-forgot a {
            color: #ff6b6b;
            text-decoration: none;
        }

        .remember-forgot a:hover {
            text-decoration: underline;
        }

        .login-btn {
            width: 100%;
            padding: 0.75rem;
            background: linear-gradient(135deg, #ff6b6b 0%, #ff5252 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .message-alert {
            padding: 1rem;
            border-radius: 5px;
            margin-bottom: 1rem;
            display: none;
            text-align: center;
        }

        .message-alert.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .message-alert.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .back-link {
            text-align: center;
            margin-top: 1.5rem;
        }

        .back-link a {
            color: #ff6b6b;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        .divider {
            text-align: center;
            color: #999;
            margin: 1.5rem 0;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            width: 100%;
            height: 1px;
            background: #ddd;
        }

        .divider span {
            background: white;
            padding: 0 10px;
            position: relative;
            z-index: 1;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 2rem;
                margin: 1rem;
            }

            .login-header h1 {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <i class="fas fa-car" style="font-size: 3rem; color: #ff6b6b;"></i>
            <h1>Lopes Veículos</h1>
            <p>Painel de Administração</p>
        </div>

        <div id="messageAlert" class="message-alert"></div>

        <form id="loginForm" onsubmit="fazerLogin(event)">
            <div class="form-group">
                <label for="email">Email</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    placeholder="seu.email@example.com"
                    required
                >
            </div>

            <div class="form-group">
                <label for="senha">Senha</label>
                <input 
                    type="password" 
                    id="senha" 
                    name="senha" 
                    placeholder="Digite sua senha"
                    required
                >
            </div>

            <div class="remember-forgot">
                <label>
                    <input type="checkbox" id="lembrar">
                    Lembrar-me
                </label>
                <a href="#" onclick="recuperarSenha(event)">Esqueceu a senha?</a>
            </div>

            <button type="submit" class="login-btn">
                <i class="fas fa-sign-in-alt"></i> Entrar
            </button>
        </form>

        <div class="divider">
            <span>ou</span>
        </div>

        <div class="back-link">
            <p style="color: #666; margin-bottom: 1rem;">Voltar para o site</p>
            <a href="../index.html">
                <i class="fas fa-home"></i> Página Inicial
            </a>
        </div>
    </div>

    <script>
        // Credenciais padrão (em produção, usar autenticação real)
        const ADMIN_EMAIL = 'admin@lopesveiculos.com';
        const ADMIN_SENHA = 'admin123';

        function fazerLogin(event) {
            event.preventDefault();

            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            const lembrar = document.getElementById('lembrar').checked;

            // Validação simples
            if (!email || !senha) {
                mostrarMensagem('Por favor, preencha todos os campos', 'error');
                return;
            }

            // Validação de credenciais (DEMO - usar autenticação real em produção)
            if (email === ADMIN_EMAIL && senha === ADMIN_SENHA) {
                // Salvar no localStorage se marcou "Lembrar-me"
                if (lembrar) {
                    localStorage.setItem('adminEmail', email);
                }

                // Salvar token de sessão
                localStorage.setItem('adminToken', 'token_' + Date.now());
                localStorage.setItem('adminLogado', 'true');

                mostrarMensagem('Login realizado com sucesso!', 'success');

                // Redirecionar após 1.5 segundos
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1500);
            } else {
                mostrarMensagem('Email ou senha incorretos', 'error');
            }
        }

        function mostrarMensagem(texto, tipo) {
            const alert = document.getElementById('messageAlert');
            alert.textContent = texto;
            alert.className = `message-alert ${tipo}`;

            if (tipo === 'error') {
                setTimeout(() => {
                    alert.className = 'message-alert';
                }, 5000);
            }
        }

        function recuperarSenha(event) {
            event.preventDefault();
            alert('Função de recuperação de senha será implementada em breve.\n\nContate: lopesveiculosyahoo@gmail.com');
        }

        // Carregar email salvo se tiver
        window.addEventListener('DOMContentLoaded', () => {
            const emailSalvo = localStorage.getItem('adminEmail');
            if (emailSalvo) {
                document.getElementById('email').value = emailSalvo;
                document.getElementById('lembrar').checked = true;
            }
        });
    </script>
</body>
</html>
